name: BTC V3 Canonical Backtest Check

on:
  push:
    branches:
      - agent/btc-v3
    paths:
      - '.github/workflows/btc-v3-canonical-backtest-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run canonical COIN-M backtest
        run: node scripts/btc-v3-backtest.js
