name: BTC V3 AHR Fusion Canonical Research

on:
  push:
    branches:
      - research/v3-ahr-fusion-canonical
    paths:
      - 'scripts/btc-v3-ahr-fusion-canonical.js'
      - '.github/workflows/btc-v3-ahr-fusion-canonical.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    if: github.ref == 'refs/heads/research/v3-ahr-fusion-canonical'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run canonical V3+AHR fusion backtest
        run: node scripts/btc-v3-ahr-fusion-canonical.js
      - name: Commit research result
        run: |
          git config user.name "v3-research[bot]"
          git config user.email "v3-research[bot]@users.noreply.github.com"
          git add research/btc-v3-ahr-fusion-canonical-result.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: update canonical V3+AHR fusion result"
          git push
