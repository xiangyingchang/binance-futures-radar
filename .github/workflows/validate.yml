name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: |
          node --check app-v3.js
          node --check api/radar.js

      - name: Check Python syntax
        run: python -m py_compile scanner.py scanner_optimized.py
