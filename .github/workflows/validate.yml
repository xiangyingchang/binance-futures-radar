name: Validate

on:
  pull_request:
  push:
    branches:
      - main
      - agent/exhaustion-short-radar-v2

permissions:
  contents: read

jobs:
  syntax-and-strategy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: |
          node --check app-v4.js
          node --check api/radar.js
          node --check api/radar-v2.js
          node --check api/strategy-sweep-30d.js
          node --check scripts/run-strategy-sweep.js
          node --check lib/strategy.js
          node --check tests/strategy.test.js

      - name: Run strategy unit tests
        run: node tests/strategy.test.js

      - name: Run research-only 30d strategy sweep
        if: github.event_name == 'pull_request'
        run: node scripts/run-strategy-sweep.js

      - name: Check Python syntax
        run: python -m py_compile scanner.py scanner_optimized.py
