name: Validate

on:
  pull_request:
  push:
    branches:
      - main
      - agent/exhaustion-short-radar-v2

permissions:
  contents: read

jobs:
  syntax-and-strategy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: |
          node --check app-v4.js
          node --check api/radar.js
          node --check api/radar-v2.js
          node --check lib/strategy.js
          node --check tests/strategy.test.js
          if [ -f research/reversal-entry-backtest-19.js ]; then node --check research/reversal-entry-backtest-19.js; fi

      - name: Run strategy unit tests
        run: node tests/strategy.test.js

      - name: Run reversal entry research
        if: ${{ github.head_ref == 'research/reversal-entry-19-20260819' }}
        timeout-minutes: 10
        run: node research/reversal-entry-backtest-19.js

      - name: Check Python syntax
        run: python -m py_compile scanner.py scanner_optimized.py
