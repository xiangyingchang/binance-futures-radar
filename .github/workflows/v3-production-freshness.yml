name: V3 Production Freshness

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'lib/**'
      - 'btc-v3*.js'
      - 'btc-v3*.html'
      - 'btc-v3*.css'
      - 'vercel.json'
      - '.github/workflows/v3-production-freshness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-production:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Vercel Git deployment
        run: sleep 90

      - name: Verify production commit and daily-analysis transport
        env:
          EXPECTED_SHA: ${{ github.sha }}
          PROD_BASE: https://binance-futures-radar.vercel.app
        run: |
          set -euo pipefail

          SNAPSHOT="$(curl --fail --silent --show-error --retry 3 --retry-delay 5 "$PROD_BASE/api/btc-v3")"
          PROD_SHA="$(node -e 'const x=JSON.parse(process.argv[1]); process.stdout.write(String(x.codeCommitSha||""))' "$SNAPSHOT")"

          if [ -z "$PROD_SHA" ]; then
            echo "Production /api/btc-v3 did not expose codeCommitSha"
            exit 1
          fi

          if [ "$PROD_SHA" != "$EXPECTED_SHA" ]; then
            echo "Production is stale: expected $EXPECTED_SHA, got $PROD_SHA"
            exit 1
          fi

          ANALYSIS="$(curl --fail --silent --show-error --retry 3 --retry-delay 5 "$PROD_BASE/api/btc-v3-daily-analysis")"
          STATUS="$(node -e 'const x=JSON.parse(process.argv[1]); process.stdout.write(String(x.status||""))' "$ANALYSIS")"
          CANDLE="$(node -e 'const x=JSON.parse(process.argv[1]); process.stdout.write(String(x.candleDate||""))' "$ANALYSIS")"

          if [ "$STATUS" != "ok" ] || [ -z "$CANDLE" ]; then
            echo "Daily analysis proxy unhealthy: status=$STATUS candleDate=$CANDLE"
            exit 1
          fi

          echo "Production fresh: $PROD_SHA; daily analysis candle: $CANDLE"
