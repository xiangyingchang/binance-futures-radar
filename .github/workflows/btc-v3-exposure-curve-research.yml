name: BTC V3 Exposure Curve Research

on:
  push:
    branches:
      - research/v3-exposure-curve
    paths:
      - 'scripts/btc-v3-exposure-curve-research.js'
      - 'tests/btc-v3-exposure-curve-research.test.js'
      - '.github/workflows/btc-v3-exposure-curve-research.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    env:
      BTC_V3_EXPOSURE_DATA_SOURCE: vision
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/v3-exposure-curve
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax and focused tests
        run: |
          node --check scripts/btc-v3-exposure-curve-research.js
          node --test tests/btc-v3-exposure-curve-research.test.js
          node --test tests/btc-v3-strategy.test.js
      - name: Run phase 2 comparative backtest
        run: node scripts/btc-v3-exposure-curve-research.js
      - name: Commit research result
        run: |
          git config user.name "v3-research[bot]"
          git config user.email "v3-research[bot]@users.noreply.github.com"
          git add research/btc-v3-exposure-curve-v2-result.json research/btc-v3-exposure-curve-v2-report.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: update V3 exposure-curve v2 result"
          git push origin HEAD:research/v3-exposure-curve
