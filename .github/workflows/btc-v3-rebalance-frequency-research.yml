name: BTC V3 Rebalance Frequency Research

on:
  push:
    branches:
      - research/v3-rebalance-frequency
    paths:
      - 'scripts/btc-v3-rebalance-frequency-research.js'
      - '.github/workflows/btc-v3-rebalance-frequency-research.yml'
      - 'research/rebalance-frequency-trigger.txt'

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run rebalance-frequency backtest
        run: node scripts/btc-v3-rebalance-frequency-research.js
      - name: Commit result
        run: |
          git config user.name "v3-research[bot]"
          git config user.email "v3-research[bot]@users.noreply.github.com"
          git add research/btc-v3-rebalance-frequency-result.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: update V3 rebalance-frequency result"
          git push
